<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股行业龙头全景 · 90行业TOP5</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#212b40;--text:#e8ecf4;--text2:#8b96ab;
--up:#ff5b5b;--down:#3dd68c;--accent:#4d9fff;--border:#2a3550;--gold:#ffc53d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10}
.brand{font-size:19px;font-weight:700}
.brand small{color:var(--text2);font-weight:400;font-size:12px;margin-left:8px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input#search{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:8px 16px;width:230px;font-size:13px;outline:none}
input#search:focus{border-color:var(--accent)}
select{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px}
.stats{display:flex;gap:20px;padding:16px 24px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px}
.stat .k{font-size:12px;color:var(--text2)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .v.gold{color:var(--gold)}
.main{max-width:1280px;margin:0 auto;padding:0 20px 40px}
.ind-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ind-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;flex-wrap:wrap;gap:8px}
.ind-head:hover{background:var(--card2)}
.ind-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.ind-title .rank{background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.ind-meta{display:flex;gap:18px;font-size:13px;color:var(--text2);align-items:center;flex-wrap:wrap}
.ind-meta b{color:var(--text)}
.badge{font-size:12px;padding:2px 10px;border-radius:10px}
.badge.n{background:var(--card2);color:var(--text2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--card2);color:var(--text2);font-weight:500;padding:8px 14px;text-align:right;position:sticky}
th:first-child,td:first-child{text-align:left;padding-left:18px}
td{padding:8px 14px;text-align:right;border-top:1px solid var(--border)}
td.l{text-align:left}
tr:hover td{background:var(--card2)}
.up{color:var(--up)} .down{color:var(--down)}
.arrow{color:var(--text2);transition:.2s;display:inline-block;margin-left:6px}
.open .arrow{transform:rotate(90deg)}
.hidden{display:none}
.footer{text-align:center;padding:24px;color:var(--text2);font-size:12px}
.footer a{color:var(--accent)}
@media(max-width:720px){
  .stats{gap:8px;padding:12px}
  .stat{flex:1;padding:8px 12px}.stat .v{font-size:15px}
  th,td{padding:6px 8px;font-size:12px}
  .ind-head{padding:12px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🏭 A股行业龙头全景<small>同花顺90个一级行业 · 每行业TOP5</small></div>
  <div class="controls">
    <input id="search" placeholder="🔍 搜索行业 / 股票 / 代码">
    <select id="sortby">
      <option value="mcap">按行业总市值</option>
      <option value="lead_chg">按龙头今日涨跌</option>
      <option value="name">按行业名称</option>
    </select>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="main" id="list"></div>
<div class="footer">数据: 同花顺扶摇API · 腾讯行情 · <span id="updated"></span> 生成 · AI Agent 自动维护 · 仅供参考非投资建议</div>
<script>
let DATA=null;
const fmtY=v=>v>=10000?(v/10000).toFixed(2)+'万亿':v.toFixed(0)+'亿';
const cls=v=>v>0?'up':(v<0?'down':'');
const sgn=v=>(v>0?'+':'')+v.toFixed(2)+'%';
async function boot(){
  const r=await fetch('data.json'); DATA=await r.json();
  const s=document.getElementById('stats');
  const up=DATA.industries.filter(i=>i.top5[0].chg>0).length;
  s.innerHTML=`<div class="stat"><div class="k">一级行业</div><div class="v">${DATA.industries.length}</div></div>
  <div class="stat"><div class="k">覆盖个股</div><div class="v">${DATA.total_stocks.toLocaleString()}</div></div>
  <div class="stat"><div class="k">全市场总市值</div><div class="v gold">${fmtY(DATA.industries.reduce((a,b)=>a+b.total_mcap,0))}</div></div>
  <div class="stat"><div class="k">行业龙头上涨 / 下跌</div><div class="v"><span class="up">${up}</span> / <span class="down">${DATA.industries.length-up}</span></div></div>`;
  document.getElementById('updated').textContent=DATA.updated;
  document.getElementById('search').oninput=render;
  document.getElementById('sortby').onchange=render;
  render();
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const sb=document.getElementById('sortby').value;
  let list=DATA.industries.filter(ind=>{
    if(!q)return true;
    if(ind.name.toLowerCase().includes(q))return true;
    return ind.top5.some(s=>s.name.toLowerCase().includes(q)||s.code.includes(q));
  });
  if(sb==='mcap')list.sort((a,b)=>b.total_mcap-a.total_mcap);
  else if(sb==='lead_chg')list.sort((a,b)=>b.top5[0].chg-a.top5[0].chg);
  else list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  const el=document.getElementById('list');
  el.innerHTML=list.map((ind,idx)=>{
    const lead=ind.top5[0];
    return `<div class="ind-card">
    <div class="ind-head" onclick="this.parentElement.classList.toggle('open');this.nextElementSibling.classList.toggle('hidden')">
      <div class="ind-title"><span class="rank">#${idx+1}</span>${ind.name}<span class="arrow">▶</span></div>
      <div class="ind-meta">
        <span class="badge n">${ind.count} 只</span>
        <span>总市值 <b>${fmtY(ind.total_mcap)}</b></span>
        <span>龙头 <b>${lead.name}</b> <b class="${cls(lead.chg)}">${sgn(lead.chg)}</b></span>
      </div>
    </div>
    <div class="hidden">
      <table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>今日涨跌</th><th>总市值</th><th>行业地位</th></tr></thead>
      <tbody>${ind.top5.map((s,i)=>`<tr>
        <td class="l">${s.code}</td><td class="l"><b>${s.name}</b></td>
        <td>${s.price.toFixed(2)}</td>
        <td class="${cls(s.chg)}">${sgn(s.chg)}</td>
        <td>${fmtY(s.mcap)}</td>
        <td>${['🥇 龙头','🥈','🥉','4','5'][i]}</td></tr>`).join('')}</tbody></table>
    </div></div>`;
  }).join('')||'<div style="text-align:center;padding:60px;color:var(--text2)">无匹配行业</div>';
}
boot();
</script>
</body>
</html>
